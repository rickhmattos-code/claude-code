# ORION VIDEO STUDIO — ambiente completo em um servidor
#   docker compose -f infra/docker-compose.yml up --build -d
#   docker compose -f infra/docker-compose.yml --profile seed run --rm seed   # catálogo + usuário demo
# Web: http://localhost:3000 · API: http://localhost:4000
#
# Armazenamento: driver local (volume "media" compartilhado entre API e worker,
# URLs assinadas por HMAC servidas pela API). Para S3/R2/B2 em produção, defina
# STORAGE_DRIVER=s3 e as variáveis S3_* (veja docs/09-infraestrutura.md).
# O MinIO foi removido: as imagens oficiais deixaram de ser publicadas.
name: orion

x-app-env: &app-env
  DATABASE_URL: postgresql://orion:orion@postgres:5432/orion
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/storage
  STORAGE_PUBLIC_BASE: /api
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  URL_SIGNING_SECRET: ${URL_SIGNING_SECRET:-troque-este-segredo-local-com-32-caracteres}
  # chaves opcionais (deixe vazio para "configuração pendente")
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  PROVIDERS_MOCK: ${PROVIDERS_MOCK:-}

services:
  postgres:
    image: postgres:16.10-alpine
    environment: { POSTGRES_USER: orion, POSTGRES_PASSWORD: orion, POSTGRES_DB: orion }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U orion"], interval: 5s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  api:
    image: orion-api:local
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: api }
    environment: *app-env
    volumes: [media:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"], interval: 5s, retries: 30 }

  worker:
    image: orion-worker:local
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: worker }
    environment:
      <<: *app-env
      WORKER_CONCURRENCY_RENDER: "1"
      WORKER_CONCURRENCY_MEDIA: "2"
    depends_on:
      api: { condition: service_healthy }
    volumes: [media:/data/storage, workertmp:/data/tmp]
    # isolamento do processamento de mídia não confiável
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "4", memory: 6g } } }

  seed:
    image: orion-worker:local
    environment: *app-env
    volumes: [media:/data/storage]
    depends_on:
      api: { condition: service_healthy }
    profiles: [seed]
    command: ["sh", "-c", "cd /app/apps/worker && SEED_DEMO=1 node --import tsx src/seed.ts"]

  web:
    image: orion-web:local
    build: { context: .., dockerfile: infra/docker/Dockerfile, target: web }
    environment: { API_INTERNAL_URL: http://api:4000 }
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]

volumes: { pgdata: {}, redisdata: {}, media: {}, workertmp: {} }
