<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Claude no WhatsApp: opções</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffaf7;
        --fg: #2b2622;
        --muted: #7a6d64;
        --line: #e3d6cd;
        --accent: #d77757;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1a17;
          --fg: #f3ebe5;
          --muted: #b5a79d;
          --line: #4a3f38;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
      }
      small {
        display: block;
        color: var(--muted);
        font-weight: 400;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        margin-top: 20px;
        padding: 9px 18px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: 600 15px system-ui, sans-serif;
        cursor: pointer;
      }
      #saved {
        margin-left: 10px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Claude no WhatsApp</h1>
      <form id="form">
        <label for="apiKey"
          >Chave da API da Anthropic
          <small
            >Fica salva só neste navegador. Use uma chave dedicada com limite
            de gastos (console.anthropic.com).</small
          >
        </label>
        <input id="apiKey" type="password" autocomplete="off" required />

        <label for="model">Modelo</label>
        <input id="model" type="text" />

        <label for="effort"
          >Esforço
          <small>Baixo responde mais rápido; alto pensa mais.</small>
        </label>
        <select id="effort">
          <option value="low">Baixo</option>
          <option value="medium">Médio</option>
          <option value="high">Alto</option>
        </select>

        <label for="persona"
          >Quem é você e como escreve
          <small
            >Ex.: "Sou o Rick, empresário. Respondo curto, informal, sem
            emojis. Com clientes, sempre cordial."</small
          >
        </label>
        <textarea id="persona" rows="5"></textarea>

        <label for="language">Idioma das respostas</label>
        <input id="language" type="text" />

        <label for="historyLimit"
          >Mensagens lidas por conversa
          <small>Até 200. Mais contexto custa mais tokens.</small>
        </label>
        <input id="historyLimit" type="number" min="1" max="200" />

        <button type="submit">Salvar</button><span id="saved"></span>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
